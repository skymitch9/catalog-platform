name: R2 write smoketest (temporary)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '113be82b840c956b8378a187047ab3ea' }}
    steps:
      - name: Guard — CLOUDFLARE_API_TOKEN must exist
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set."
            exit 1
          fi
      - uses: actions/checkout@v5
      - name: Write a tiny test object with wrangler
        run: |
          echo "smoketest $(date -u +%Y-%m-%dT%H:%M:%SZ) run ${{ github.run_id }}" > smoke.txt
          if npx --yes wrangler@4.123.0 r2 object put "estate-backups/_smoketest/${{ github.run_id }}.txt" --file smoke.txt --remote -y; then
            echo "WRITE_OK=1" >> "$GITHUB_ENV"
          else
            echo "WRITE_OK=0" >> "$GITHUB_ENV"
          fi
      - name: Report
        run: |
          if [ "$WRITE_OK" = "1" ]; then
            echo "::notice::R2 write with CLOUDFLARE_API_TOKEN SUCCEEDED."
          else
            echo "::error::R2 write with CLOUDFLARE_API_TOKEN FAILED — token needs 'Workers R2 Storage: Edit' (Account) permission added via dash.cloudflare.com -> My Profile -> API Tokens -> edit CLOUDFLARE_API_TOKEN."
            exit 1
          fi
      - name: Clean up test object (best effort)
        if: always()
        run: npx --yes wrangler@4.123.0 r2 object delete "estate-backups/_smoketest/${{ github.run_id }}.txt" --remote -y || true
