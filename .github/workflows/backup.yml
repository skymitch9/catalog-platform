name: Backup (daily + manual)

# ⚠️ CADENCE ADDED 2026-08-18 — this used to be dispatch-only. Read this before
# removing the cron; the change is one `schedule:` block and is trivially
# reversible, but the reasoning is measured, not aesthetic.
#
# The old posture was "manual dispatch only, same posture as deploy.yml — a
# backup is a deliberate button-press, never a schedule, so nobody has to
# reason about a cron quietly touching credentials at 3am". The owner decision
# that phrase inherited (2026-08-14, now in docs/DONE.md) is about the DEPLOY
# workflows — *"these Workers have no dev lane, so the trigger stays a
# deliberate human button-press"*. That argument is about a live blast radius:
# a deploy changes what the estate serves. A backup does not. It writes new
# objects into one private bucket and changes nothing anyone can reach.
#
# What the restore drill MEASURED (docs/access/RECOVERY.md §1c, 2026-08-18)
# as the price of the dispatch-only posture, over LESS THAN TWO DAYS of
# nobody pressing the button:
#
#   estate_auth        6 migrations behind, 4 columns on estate_user
#   estate_session     0 rows backed up vs 11 live — every session
#   site_role_grant_log 0 vs 14 — the whole grant audit trail
#   library-catalog    5 migrations, +84 works / +77 editions / +94 copies,
#                      +469 change_log, +245 research_finding, and the whole
#                      `ebook_holding` table (126 rows) absent
#   audiobook-covers   +103 objects
#
# ⚠️ THE CREDENTIAL OBJECTION IS ANSWERED, NOT IGNORED. The secrets are the
# same two this workflow already uses on every manual dispatch, they are never
# printed (§ the guard steps below), and a scheduled run reaches them by
# exactly the same GitHub-hosted path a dispatched run does. The cron adds a
# CALLER, not a new trust boundary.
#
# ## Why 09:12 UTC daily — the choice, measured
#
# * DAILY, not weekly: the drift table above is under two days old. A weekly
#   cron bounds the loss at a week; daily bounds it at a day, and the cost
#   difference is zero (below).
# * COST IS ZERO MINUTES. `catalog-platform` is a PUBLIC repo (verified
#   2026-08-18, `gh api repos/... --jq .visibility` -> public), and GitHub does
#   not meter Actions minutes on public repos. Measured on the newest
#   `target=all` run (31937416822, 2026-08-16): 144 s wall clock, ~458 s of
#   runner time across 9 jobs, and the API's own billing endpoint reports
#   `total_ms: 0` for every job. R2 storage is the only real cost and it is
#   bounded by the retention job (8 generations per store).
# * 09:12 UTC because: it is OFF the hour (GitHub queues scheduled workflows in
#   a burst at :00 and the delay can run to tens of minutes), it is ~04:12
#   America/Chicago — after the household's day has ended so the snapshot
#   catches it whole, and before the morning — and it is the same part of the
#   day the two existing real backups happen to have landed in (08:49Z and
#   19:16Z), so nothing about the observed runtime is a surprise.
# * ⚠️ GitHub DISABLES scheduled workflows on a repo with 60 days of no
#   activity, and emails the owner first. If backups quietly stop, check
#   Actions → this workflow for the "disabled" banner before suspecting the
#   credentials.
# * The `workflow_dispatch` button is untouched — an on-demand backup before a
#   risky change is still one click, and `target` still narrows it.
#
# See docs/access/backup-restore.md for the full runbook (what's protected, how
# to restore, what is deliberately NOT backed up here) and
# docs/access/RECOVERY.md for the drill that produced this cadence.
#
# ⚠️ 2026-08-15 rewrite: this workflow used to run from the PRIVATE
# skymitch9/estate-backups repo and upload each job's output as a workflow
# artifact. catalog-platform is public again (repo-size trigger, not a
# privacy flip — see docs/access/backup-restore.md's history), and GitHub
# artifacts on a public repo are one anonymous login away from anyone on
# Earth (the same reasoning §2 below already applies to D1 exports).
# Artifacts are wrong for a household backup on a public repo full stop, so
# this workflow no longer uses actions/upload-artifact anywhere — every
# job's output is written straight into the PRIVATE `estate-backups` R2
# bucket instead, via `wrangler r2 object put ... --remote`. The bucket has
# no public access and no custom domain (verified at creation time,
# docs/access/backup-restore.md §1). Moving the WORKFLOW back onto the
# public repo (rather than leaving it on the private estate-backups repo)
# means it runs with zero extra owner steps: CLOUDFLARE_API_TOKEN already
# exists here as a secret, already has enough R2 permission to write
# objects (proven with a throwaway smoke-test object before this rewrite —
# see docs/access/backup-restore.md §1), and no second repo needs its own
# copy of these scripts kept in sync.
#
# Three independent backup jobs, each writing its own object(s) into
# estate-backups/<kind>/<store>/<UTC-timestamp>.<ext> — plus one retention
# job that prunes each <kind>/<store> prefix down to the newest 8 objects,
# every run, regardless of which target was dispatched:
#
#   d1        → `wrangler d1 export` for all FIVE estate D1 databases, by
#                database ID — this job needs NO wrangler.toml and NO sibling
#                checkout, because `wrangler d1 export <id> --remote` is an
#                account-level operation (proven interactively 2026-08-14: it
#                ran clean from an empty directory with only
#                CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID set). That is also
#                why this workflow can back up board-game-catalog's and
#                library-catalog's D1s even though it lives in a THIRD repo —
#                see the note below on why it does. Each export is a single
#                .sql file, uploaded as-is.
#
#   firestore → scripts/backup-firestore.mjs, a recursive per-collection JSON
#                dump via a service account (no gcloud/GCS infrastructure).
#                The dump is many small JSON files; this job tars+gzips them
#                into one object before the R2 put (R2 objects are put
#                one-at-a-time by key, and a directory of ~60 files per run
#                is cheaper as one archive than sixty tiny objects).
#
#   r2        → scripts/backup-r2.mjs, a full object dump (manifest.json +
#                every object's bytes) of the R2 buckets that hold
#                user/pipeline content — `library-covers`, `audiobook-covers`,
#                `game-covers`, and (added 2026-08-18) the two tiny gated
#                buckets `ebooks-gated` and `estate-docs-gated` — via the
#                plain Cloudflare REST API (list + get, Bearer-token auth), no
#                S3-compatible credentials needed. Same tar+gzip-then-put
#                shape as firestore, since a bucket dump can be hundreds to
#                thousands of files (audiobook-covers alone is ~1,868
#                objects).
#
#                ⚠️ WHICH R2 BUCKETS ARE **DELIBERATELY** LEFT OUT, AND WHY —
#                this is the list the restore drill asked for (RECOVERY.md
#                §1b), kept here beside the matrix it explains rather than in
#                a doc that can drift from it:
#
#                  estate-ebooks   168 objects / 1.81 GB of ebook FILES. A
#                                  local master exists and is authoritative:
#                                  audiobook_catalog/scripts/upload_ebooks_r2.py
#                                  re-uploads the whole bucket from disk. So
#                                  this is RECOVERABLE, not lost — the copy
#                                  would cost ~1.8 GB per generation × 8
#                                  generations to protect something a script
#                                  already rebuilds. ⚠️ The residual risk is
#                                  real and named: that protection lasts
#                                  exactly as long as the owner's disk. Add it
#                                  here the day the local master stops being
#                                  a safe assumption.
#                  estate-audio    🔴 **NEVER ADD THIS ONE.** Rewritten
#                                  2026-08-18: it is no longer "0 objects,
#                                  empty by design". It now holds the DISASTER-
#                                  RECOVERY ARCHIVE of the whole audiobook
#                                  library — 1,260 objects / ~685 GB under the
#                                  `archive/` prefix, written by
#                                  audiobook_catalog/scripts/archive_audio_r2.py
#                                  on the owner's order ("we lose this data we
#                                  lose it all and the server isnt ready yet").
#                                  ⚠️ THIS BUCKET IS ITSELF THE BACKUP — it is
#                                  the off-site copy of files whose master is
#                                  the owner's disk. Tarring 685 GB nightly and
#                                  putting it back into estate-backups would be
#                                  a backup of a backup, ~8 generations deep,
#                                  and it would not be a backup at all: it is a
#                                  runner with a 14 GB disk, a job that cannot
#                                  finish, and a red X on every other store's
#                                  backup every night. A 685 GB daily tar is not
#                                  a backup, it is an outage.
#                                  The `archive/` prefix is also the one thing
#                                  in this estate that must NEVER be evicted or
#                                  lifecycle-expired; see
#                                  audiobook_catalog docs/access/AUDIO_ARCHIVE.md.
#                  bgc-photos      0 objects (feature not live).
#                  library-2nd-covers  0 objects.
#                  estate-backups  the backup bucket itself — backing it up
#                                  into itself is not a copy. Getting a copy
#                                  OFF Cloudflare is an open owner step
#                                  (RECOVERY.md §9 item 7).
#
#                ⚠️ The two remaining zero-object buckets (`bgc-photos`,
#                `library-2nd-covers`) join the matrix the day either holds
#                anything. **`estate-audio` is explicitly NOT covered by that
#                rule any more** — it used to be, as one of "the three
#                zero-object buckets", and that sentence would now auto-enroll
#                685 GB into a nightly tar. It is excluded on its merits, not
#                on its emptiness, and it stays excluded however full it gets.
#
#   retention → scripts/prune-r2-backups.mjs, keeps the newest 8 objects per
#                <kind>/<store> prefix in estate-backups and deletes the
#                rest, logging every key kept and deleted. Runs every
#                dispatch regardless of `target`, over ALL known prefixes —
#                retention is bucket hygiene, not scoped to what this
#                particular run touched.
#
#                ⚠️ "8 DEEP" WAS A SETTING AND NOT YET A FACT — RESOLVED
#                2026-08-18. The drill found the bucket holding 2 generations
#                per store against a configured 8 and flagged it as possibly a
#                prune bug. It is not: the cause is a YOUNG SYSTEM. This
#                workflow only started writing into R2 (rather than uploading
#                artifacts) on 2026-08-15 evening, and exactly TWO runs have
#                used that path — 31903443263 (2026-08-15T19:16Z) and
#                31937416822 (2026-08-16T08:49Z). The retention job's own log
#                on the second of those reads `2 object(s), keeping 2,
#                deleting 0` for all 8 prefixes and `Deleted 0 object(s)
#                total`, which is exactly correct behaviour for a bucket that
#                has never held more than 8. The daily cron above is what
#                makes 8 real: it fills to the configured depth in 8 days, and
#                the first deletion is expected on day 9.
#
# ⚠️ WHY EVERY D1 BACKUP LANDS HERE AND NOT IN THE REPO THAT OWNS EACH DB:
# `Board_Game_Catalog` is a PUBLIC repo (verified via `gh repo view`,
# 2026-08-14). GitHub's own docs + the linked community reports say
# downloading a workflow artifact needs only "read access to the repository" —
# and on a PUBLIC repo, EVERY authenticated GitHub account has read access,
# not just collaborators. A D1 export of board-game-catalog is a household
# database dump; it must never be one anonymous GitHub signup away from
# anyone — which is exactly why this workflow no longer uses artifacts at
# all, for ANY job, now that this repo is public too. `wrangler d1 export`
# not needing a wrangler.toml for the target database is what makes backing
# up all four from here possible without a cross-repo checkout.

on:
  # ⚠️ A scheduled run has NO `inputs`, so `inputs.target` is null on every
  # cron tick and every `if:` below would evaluate false. `github.event_name ==
  # 'schedule'` is therefore part of each job's condition: a cron run always
  # backs up EVERYTHING, which is also the only cadence that makes sense for an
  # unattended run — a partial scheduled backup would leave stores silently
  # stale while the summary read fresh (apps/auth-worker/src/backups.ts grades
  # per-store precisely because of that failure mode).
  schedule:
    - cron: '12 9 * * *' # daily 09:12 UTC — see the header for why this hour
  workflow_dispatch:
    inputs:
      target:
        description: 'What to back up'
        type: choice
        required: true
        default: all
        options:
          - d1
          - firestore
          - r2
          - all

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '113be82b840c956b8378a187047ab3ea' }}

jobs:
  d1:
    if: github.event_name == 'schedule' || inputs.target == 'd1' || inputs.target == 'all'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # database_id, not database_name — export-by-id needs no
          # wrangler.toml, so this job has no sibling checkout at all.
          - name: library-catalog
            id: 6022ea5e-2510-450e-81ce-7d847fa31379
            owner_repo: skymitch9/library_catalog
          # Added 2026-08-18. The restore drill found this one LIVE and with no
          # backup anywhere (RECOVERY.md §1b hole #1): the padhard.heygabi.ai
          # shelf, a second library instance holding user-entered catalog data
          # with no other copy — the exact argument that makes `library-catalog`
          # High priority. It was absent from this matrix, from the retention
          # job's prefix list and from backups.ts's KNOWN_BACKUP_PREFIXES alike,
          # which is why all three now have a test asserting they agree
          # (apps/auth-worker/test/backups.test.ts).
          - name: library-catalog-2nd
            id: 9dcf4af9-d1a2-4de4-adcf-ac7eea77f1c8
            owner_repo: skymitch9/library_catalog (apps/worker, env `friend`)
          - name: board-game-catalog
            id: 7dd22702-f0e2-4fc7-b201-d16d60176efa
            owner_repo: skymitch9/Board_Game_Catalog
          - name: index_catalog
            id: 3004d175-3c51-4ed4-ac3e-62859319f8ac
            owner_repo: skymitch9/catalog-platform (apps/index-worker)
          - name: estate_auth
            id: d94ffe45-4dd0-4dc2-86de-b8c4d649c1cb
            owner_repo: skymitch9/catalog-platform (apps/auth-worker)
    steps:
      - name: Guard — CLOUDFLARE_API_TOKEN must exist
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN: repo Settings → Secrets → Actions (or: gh secret set CLOUDFLARE_API_TOKEN --repo skymitch9/catalog-platform). Same token deploy.yml already uses — D1 export needs only 'D1 Edit' scope, which the existing token already carries."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (for the pinned wrangler binary)
        run: npm ci
      - name: Export ${{ matrix.name }} (${{ matrix.owner_repo }})
        run: |
          mkdir -p backups
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          npx wrangler d1 export "${{ matrix.id }}" --remote --output="backups/${{ matrix.name }}-$STAMP.sql" -y
      - name: Verify the export is non-empty
        run: |
          f=$(ls backups/${{ matrix.name }}-*.sql)
          bytes=$(wc -c < "$f")
          echo "::notice::$f is $bytes bytes."
          if [ "$bytes" -lt 50 ]; then
            echo "::error::Export for ${{ matrix.name }} is suspiciously small ($bytes bytes) — treating as a failed backup."
            exit 1
          fi
      - name: Upload to R2 (estate-backups)
        run: |
          KEY="d1/${{ matrix.name }}/$STAMP.sql"
          npx wrangler r2 object put "estate-backups/$KEY" --file "backups/${{ matrix.name }}-$STAMP.sql" --remote -y
          echo "::notice::Wrote estate-backups/$KEY"

  firestore:
    if: github.event_name == 'schedule' || inputs.target == 'firestore' || inputs.target == 'all'
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Guard — FIREBASE_SERVICE_ACCOUNT_JSON must exist
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Set FIREBASE_SERVICE_ACCOUNT_JSON: repo Settings → Secrets → Actions. Paste the FULL JSON content of a Firebase service account key (Firebase console -> audiobook-catalog project -> Project settings -> Service accounts -> Generate new private key) as the secret value — not a path, the JSON itself. See docs/access/backup-restore.md §3."
            exit 1
          fi
      - name: Guard — CLOUDFLARE_API_TOKEN must exist
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN: repo Settings → Secrets → Actions."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dump Firestore
        run: |
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          BACKUP_OUT_DIR="backups/firestore-$STAMP" node scripts/backup-firestore.mjs
      - name: Archive the dump (many small JSON files -> one object)
        run: |
          tar czf "backups/firestore-$STAMP.tar.gz" -C "backups/firestore-$STAMP" .
          bytes=$(wc -c < "backups/firestore-$STAMP.tar.gz")
          echo "::notice::firestore-$STAMP.tar.gz is $bytes bytes."
      - name: Upload to R2 (estate-backups)
        run: |
          KEY="firestore/audiobook-catalog/$STAMP.tar.gz"
          npx wrangler r2 object put "estate-backups/$KEY" --file "backups/firestore-$STAMP.tar.gz" --remote -y
          echo "::notice::Wrote estate-backups/$KEY"

  r2:
    if: github.event_name == 'schedule' || inputs.target == 'r2' || inputs.target == 'all'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ⚠️ ebooks-gated + estate-docs-gated added 2026-08-18 (RECOVERY.md §1b
        # holes #5/#6): 2 objects / 107 kB and 2 objects / 1.27 MB. Both are
        # republished by a pipeline step, but BOTH publishers run on the
        # owner's machine — `estate-docs-gated` is rebuilt from three docs
        # trees that exist together nowhere else — so the copy is worth
        # essentially nothing to take and is the only estate-side copy there
        # is. The buckets NOT here are argued in the header above.
        #
        # 🔴 **DO NOT ADD `estate-audio`.** It holds the ~685 GB disaster-
        # recovery archive of the audiobook library (`archive/` prefix). This
        # job tars a WHOLE bucket onto a 14 GB runner disk and uploads the tar —
        # a 685 GB daily tar is not a backup, it is an outage, and the bucket is
        # itself the backup copy of local files. The header above carries the
        # full argument. Adding it is not a matrix edit, it is an incident.
        bucket: [library-covers, audiobook-covers, game-covers, ebooks-gated, estate-docs-gated]
    steps:
      - name: Guard — CLOUDFLARE_API_TOKEN must exist
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN: repo Settings → Secrets → Actions (or: gh secret set CLOUDFLARE_API_TOKEN --repo skymitch9/catalog-platform)."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Back up ${{ matrix.bucket }}
        run: |
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          BACKUP_OUT_DIR="backups/r2-${{ matrix.bucket }}-$STAMP" node scripts/backup-r2.mjs "${{ matrix.bucket }}"
      - name: Archive the dump (manifest + objects -> one file)
        run: |
          tar czf "backups/r2-${{ matrix.bucket }}-$STAMP.tar.gz" -C "backups/r2-${{ matrix.bucket }}-$STAMP" .
          bytes=$(wc -c < "backups/r2-${{ matrix.bucket }}-$STAMP.tar.gz")
          echo "::notice::r2-${{ matrix.bucket }}-$STAMP.tar.gz is $bytes bytes."
      # ⚠️ SPLIT WHEN OVERSIZED — MEASURED 2026-08-18, on a real failed backup.
      #
      # `wrangler r2 object put` refuses anything over 300 MiB:
      #     Error: Wrangler only supports uploading files up to 300 MiB in size
      # and on run 32112007920 the audiobook-covers dump tarred to 328,774,189
      # bytes (313.5 MiB) and was rejected. The download had already succeeded;
      # the whole backup was lost at the last step. ⚠️ game-covers measured
      # 178,897,690 bytes (170.6 MiB) the same day and is growing — this is not
      # a one-bucket problem, which is why the split is generic rather than
      # special-cased.
      #
      # There is no way round the ceiling with the credentials this estate has:
      # the plain Cloudflare REST `PUT .../objects/{key}` carries the same
      # limit, and multipart upload needs S3-compatible access keys that
      # deliberately do not exist here (scripts/backup-r2.mjs's header says
      # why). So: split into 200 MiB parts and upload each as its own object,
      # `<STAMP>.tar.gz.part-aa`, `.part-ab`, …
      #
      # The threshold is 250 MiB, not 300, so there is headroom rather than a
      # cliff — a bucket that grows between the check and the next run does not
      # discover the limit the hard way. `split -d` is avoided on purpose:
      # the default alphabetic suffixes sort lexicographically in `cat`, `ls`
      # and R2's own listing alike.
      #
      # ⚠️ RESTORE: reassemble before untarring —
      #     cat <STAMP>.tar.gz.part-* > dump.tar.gz
      # docs/access/RECOVERY.md §5 and backup-restore.md §6 carry this.
      #
      # ⚠️ Retention had to learn about this: one generation is now potentially
      # several keys, so scripts/prune-r2-backups.mjs keeps the newest 8
      # GENERATIONS (grouped by stamp), never the newest 8 keys, and deletes a
      # generation's parts together. A half-deleted generation cannot be
      # reassembled and must never exist.
      - name: Upload to R2 (estate-backups)
        run: |
          FILE="backups/r2-${{ matrix.bucket }}-$STAMP.tar.gz"
          BASE="r2/${{ matrix.bucket }}/$STAMP.tar.gz"
          MAX_SINGLE=262144000   # 250 MiB — below wrangler's 300 MiB hard cap
          bytes=$(wc -c < "$FILE")

          if [ "$bytes" -le "$MAX_SINGLE" ]; then
            npx wrangler r2 object put "estate-backups/$BASE" --file "$FILE" --remote -y
            echo "::notice::Wrote estate-backups/$BASE"
          else
            echo "::warning::$FILE is $bytes bytes, over the ${MAX_SINGLE}-byte single-object threshold (wrangler's hard cap is 300 MiB) — splitting into 200 MiB parts. Restore must 'cat <STAMP>.tar.gz.part-* > dump.tar.gz' first; see docs/access/RECOVERY.md §5."
            split -b 200m "$FILE" "$FILE.part-"
            n=0
            for part in "$FILE".part-*; do
              suffix="${part##*.}"
              npx wrangler r2 object put "estate-backups/$BASE.$suffix" --file "$part" --remote -y
              echo "::notice::Wrote estate-backups/$BASE.$suffix"
              n=$((n+1))
            done
            if [ "$n" -eq 0 ]; then
              echo "::error::split produced no parts for $FILE — refusing to report a successful backup."
              exit 1
            fi
            echo "::notice::$BASE was written as $n part(s)."
          fi

  retention:
    # Runs on every dispatch regardless of `target` — pruning is bucket
    # hygiene across ALL known prefixes, not scoped to what this run backed
    # up. `if: always()` so a skipped d1/firestore/r2 job (target != all)
    # does not skip retention too.
    needs: [d1, firestore, r2]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Guard — CLOUDFLARE_API_TOKEN must exist
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN: repo Settings → Secrets → Actions."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prune estate-backups to the newest 8 per store
        run: |
          node scripts/prune-r2-backups.mjs estate-backups \
            d1/library-catalog d1/library-catalog-2nd d1/board-game-catalog d1/index_catalog d1/estate_auth \
            firestore/audiobook-catalog \
            r2/library-covers r2/audiobook-covers r2/game-covers r2/ebooks-gated r2/estate-docs-gated \
            --keep 8
