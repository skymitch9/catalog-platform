#     the estate's Discord Worker"; the destination then resolves the
#     on-behalf-of Firebase uid to its own app_user row and checks THAT person's
#     capability. So a leak buys the ability to act for people who already hold
#     the capability, on a surface where every write is stamped `gabi-discord`
#     and is revertible in the app — a smaller blast radius than the bot token's.
#     ⚠️ SHIPS DARK until set: she answers "I'm not wired up to write to the
