# The estate Discord Worker — the bot's one HTTP interactions endpoint,
# deliberately its OWN Worker (discord-bot-design.md §1.3 / decision #2):
# the bot token is a second wide-blast-radius shared credential and must not
# live inside the Worker that gates the estate's membership (auth-worker).
# Discord delivers every interaction (PING handshake, buttons, slash
# commands) as an HTTP POST to the single URL configured in the Developer
# Portal — no gateway, no persistent connection.
#
# DEPLOYED 2026-08-16 late — the owner registered application "GABI"
# (id 1538775435880562758) and handed over the two portal identifiers; the
# deliberate not-deployed hold above is over. The full runbook stays
# docs/access/discord-bot.md; remaining owner steps at first deploy were the
# bot token paste and the Interactions Endpoint URL save.

name = "estate-discord"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Added at deploy time (2026-08-16), mirroring auth-worker / index-worker's
# history. Discord's Interactions Endpoint URL is:
#   https://discord.heygabi.ai/interactions
routes = [{ pattern = "discord.heygabi.ai", custom_domain = true }]

# The gateway's cron backstop — RESTORED 2026-08-17, after the owner moved
# the account to Workers Paid ("cloudflare upgraded"; crons 5 → 250). The
# first attempt at this block was REFUSED the same day under Workers Free
# ("This account has reached the Workers Free limit of 5 cron triggers per
# account") and was removed so wrangler.toml could fully apply — so THIS
# deploy succeeding is the measured proof the plan change took. If it is
# ever refused again, remove the block again rather than shipping a config
# that half-applies (a wrangler.toml that cannot fully apply makes every
# future deploy exit with a partial-failure banner).
#
# ⚠️ Redundancy, not the mechanism: the gateway's alarm chain is
# self-sustaining once started (each alarm schedules the next, and an alarm
# re-creates an evicted object). The cron is the backstop for a broken
# chain; `POST /admin/gateway/start` stays the manual lever. With
# GABI_MENTIONS off the scheduled handler returns before touching the
# object — dark ships free, exactly as before.
[triggers]
crons = ["*/2 * * * *"]

# ⚠️ WORKERS LOGS — ENABLED 2026-08-18, AND THE REASON IS AN INCIDENT.
#
# At 7:28 PM Phoenix the second real non-owner user ever to talk to GABI asked a
# question in a channel and got NOTHING. Her next message was "Did you turn her
# off?" — she had not been turned off. When the estate went looking for why,
# there was nowhere to look: `wrangler tail` is a LIVE stream and nobody was
# watching, the event ring was never wired to this Worker, an unanswered turn
# writes no conversation record by design, and the daily fuses keep counts with
# no history. Every one of those absences is correct on its own terms, and
# together they made a real person's complaint un-investigable.
#
# ⚠️ THIS IS THE INSTRUMENT THAT RETAINS. `apps/audiobook-worker` already runs
# the same block, and `docs/info/audiobook-auth-soak-rerun-2026-08-17.md` §2
# records it read back live from the settings API — so this is a proven pattern
# on this account rather than a hopeful one.
#
# ⚠️ WHAT MUST NEVER BE LOGGED, and it is a standing promise rather than a
# preference: `docs/info/gabi-bare-text-triggers-memo.md` §6.2 names "nothing
# logs the message content" as the estate's most fragile privacy claim — "one
# careless line away from being false". Turning retention ON raises the price of
# that line, it does not lower it. `gabi_turn` accounting logs token COUNTS and
# snowflakes and no text, the turn ring stores no text at all, and it stays that
# way.
#
# head_sampling_rate = 1 : keep everything. This Worker handles a household's
# traffic, not a website's; sampling a low-volume Worker means the one request
# somebody asks about is the one that was dropped.
[observability]
enabled = true
head_sampling_rate = 1

# ⚠️ The one persistent WebSocket to Discord's gateway, so GABI HEARS ordinary
# messages that @mention her (src/gateway.ts). A single named instance,
# deliberately: Discord's gateway is one connection per bot, and a per-request
# object would open one socket per caller and get the bot rate-limited into a
# ban.
#
# ⚠️ COST — and on this account the binding constraint is NOT money, it is a
# hard free-plan daily cap. Outbound WebSockets cannot hibernate ("Hibernation
# is only supported when a Durable Object acts as a WebSocket server"), so this
# accrues duration whenever it is connected: 128 MB × 86,400 s = ~10,800 GB-s
# per day, against the Workers Free allowance of **13,000 GB-s/day**. That is
# **$0.00/month and about 83% of a cap that STOPS the object rather than
# billing for it** — roughly 17% headroom.
# ⚠️ Two things would eat that headroom and both are blocking: a SECOND
# always-on Durable Object anywhere on this account, and any reconnect pattern
# leaving two sockets briefly overlapping. On Workers Paid the same object sits
# inside the 400,000 GB-s/month inclusion (~$4.05/month if ever billed at the
# full $12.50 per million GB-s), so upgrading removes the constraint entirely.
# Requests (~3,000/day of 100,000) and row writes (~2,100/day of 100,000) are
# comfortable. All arithmetic over a published table — not an invoice.
[[durable_objects.bindings]]
name = "GABI_GATEWAY"
class_name = "GabiGateway"

# SQLite-backed, the current default class for new Durable Objects. The object
# stores the resumable gateway session, the daily identify budget, the two spend
# counters — and, since 2026-08-17, the CONVERSATION MEMORY (`conv:` keys).
#
# ⚠️ THE MEMORY IS HERE BECAUSE A SECOND ALWAYS-ON OBJECT WAS BLOCKED at design
# time (see the cost note above: this one uses ~83% of the FREE plan's daily
# Durable Object duration). Continuity therefore added NO new object, NO D1
# binding, NO Firestore collection and NO cron. It added rows to storage this
# object already had.
#
# ⚠️ THE PLAN CHANGED UNDER THIS PARAGRAPH, and the design was NOT re-loosened.
# docs/TODO.md records the owner upgrading to **Workers Paid on 2026-08-17**
# ("cloudflare upgraded"), which lifts the duration pressure and raises crons
# 5→250. That is the repo's own dated record, NOT something this build measured
# — no deploy here has exercised the new limits. Reusing the existing object was
# the right call under the tighter ceiling and stays the right call under the
# looser one, so nothing was re-architected to spend the new headroom.
#
# ⚠️ WRITE BUDGET, and it is arithmetic over an existing cap rather than a hope.
# A conversation row is written ONCE PER ANSWERED TURN, and answered turns are
# already fused at GLOBAL_TURNS_PER_DAY = 200. Worst case ≈200 saves + ≈200
# garbage-collecting deletes = **≤400 row writes/day**, on top of the ~2,100 the
# heartbeat already accrues. New total ≈2,500/day against the FREE plan's
# **100,000 rows/day** — about 2.5%. ⚠️ Deliberately priced against the TIGHTER
# (free) ceiling: a bound proven under the stricter limit is still a bound under
# the looser one, and pricing against Paid would have to be re-derived the day
# anybody downgrades. Loads perform no write at all.
# ⚠️ Do NOT reintroduce the defect class this avoids: an early version of
# gateway.ts wrote the sequence number on EVERY FRAME (a row write per message
# in every channel of every guild) and was corrected to once per heartbeat.
# Nothing in the memory path writes per frame.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GabiGateway"]

[vars]
# Explicit, affirmative value — same idiom as the sibling Workers.
ENVIRONMENT = "production"

# The shared estate Firebase project. Added 2026-08-17 with the identity-link
# ceremony: the canonical verifier (@platform/estate-auth) asserts this as
# BOTH the issuer and the audience of every Firebase ID token it accepts.
# ⚠️ Removing it does not make the check smaller, it makes it absent — any
# Firebase project's tokens are validly signed by Google. Same value as
# auth-worker / index-worker / audiobook-worker; a var, not a secret (it is a
# project name, and it ships in every browser bundle already).
FIREBASE_PROJECT_ID = "audiobook-catalog"

# The estate break-glass addresses, mirroring auth-worker's var of the same
# name. Read by exactly one thing: the gate on POST /admin/commands/register
# (src/commands.ts). Everything else resolves authority from site_roles/{uid}.
OWNER_EMAILS = "nbaslamking@gmail.com,mitchlandtv@gmail.com"

# The estate index `/have` queries (design §2b). A var, not a secret: the host
# is public and ⚠️ the call carries NO credential at all — that absence IS the
# scope decision (§4 decision 4: an unlinked Discord user gets the same public
# audiobook slice as an anonymous web visitor). Present so a test or a future
# lane can point elsewhere; the default in code is this same host.
INDEX_BASE_URL = "https://index.heygabi.ai"

# ⚠️ THE AUDIOBOOK SITE, added 2026-08-18 with GABI's Tier-0 catalogue tools —
# and it exists because THE ESTATE INDEX DOES NOT HOLD A NARRATOR. Measured that
# day rather than assumed, by reading apps/index-worker/migrations/0001_entry.sql
# and by querying the live host: `entry`'s columns are source, source_id, title,
# creator, title_fold, work_fold, universe, series, series_slug, series_index,
# year, publisher, format, kind, parent_source_id, cover_url, detail_url,
# pushed_at. There is no narrator column, no duration column and no genre column
# — the index is a cross-catalog POINTER table by its own schema's declaration
# ("POINTERS, NEVER TRUTH"). So the owner's canonical question, "who's the
# narrator of Way of Kings?", is structurally unanswerable from /api/search.
#
# It IS answerable from this host. Measured 2026-08-18 on the live site:
#   GET https://audiobooks.heygabi.ai/catalog.csv
#     -> 200, text/csv; charset=utf-8, access-control-allow-origin: *
#     -> 1,410,970 bytes, 1,079 audiobook rows
#     -> narrator filled 1079/1079, duration 1079/1079, genre 1078,
#        year 1048, series 895, universe 237, library_formats 86
#
# ⚠️ A VAR, NOT A SECRET, and the call carries NO Authorization header at all —
# that absence IS the scope decision, exactly as it is for INDEX_BASE_URL above.
# This is the same CSV every anonymous visitor to audiobooks.heygabi.ai already
# downloads to render the site's own table, so reading it reveals nothing the
# web does not publish. ⚠️ It is NOT a licence to read a GATED surface: no ebook
# manifest, no file bytes, no signed URL. Those need the asker's Firebase
# identity, which this Worker structurally cannot mint (src/have.ts explains why
# at length, and src/firebase-sa.ts is scoped to `datastore` only).
#
# Present so a test or a future lane can point elsewhere; the default in code
# (src/catalog-data.ts) is this same host.
CATALOG_BASE_URL = "https://audiobooks.heygabi.ai"

# Where `/gabi` sends people (the fixer's Discord surface, shape (b)
# propose-and-deep-link — library_catalog gabi-fixer-design.md §10.2). This is
# Samantha's instance, the only one whose GABI_PANEL posture is on; the main
# library has it off by decision 8, so linking there would offer a panel that
# does not exist.
# ⚠️ A var, not a secret, and NOT a capability: the URL appears in the bot's own
# replies, and following it proves nothing — the site does its own Firebase
# sign-in and its own `runResearch` role check. That is the whole reason shape
# (b) needs no new credential, no token custody, and no Anthropic key here.
# ⚠️ The link is deliberately BARE (no ?q=): measured 2026-08-17, the panel
# parses no URL parameter at all, so a query string would be a promise the page
# cannot keep. A prefill is PANEL work, recorded in the design doc.
GABI_PANEL_URL = "https://padhard.heygabi.ai"

# ⚠️ MODERATION KILL-SWITCH (owner order 2026-08-16: "disable her reacting to
# any admin mod stuff for now until we get further along"). Declared here
# BEFORE the moderation build existed, so that build would ship DARK behind it
# by contract: every mod code path must check this var and answer a worded
# "moderation is switched off" ephemeral while it is anything but "on".
#
# ⚠️ CONSUMED SINCE 2026-08-17 — /timeout and /cleanup are BUILT (src/
# moderation.ts, src/mod-actions.ts) and the contract is pinned by
# test/moderation.test.ts, including that "true", "1" and "yes" all mean OFF.
# It is ALSO read by src/commands.ts: while this is off, the two commands are
# not even published to Discord, so nobody sees a moderation control that
# cannot act. Flipping it is the owner's evidence-gated step — never a side
# effect of a deploy — and the flip has a documented SECOND step: re-run
# POST /admin/commands/register so the pair appears (access/discord-bot.md).
MODERATION_ENABLED = "off"

# ⚠️ THE CONVERSATIONAL KILL-SWITCH — phase A of the owner's ask, *"I want to
# use heygabi and similar forms ... to kick her off for a question and then she
# responds"* (2026-08-17). Affirmative-only in the exact idiom of
# MODERATION_ENABLED above and the library's own GABI_PANEL: "on" and nothing
# else; absent, empty, "true", "1", "yes" and every typo all mean OFF, and
# test/mentions.test.ts pins that both ways.
#
# ⚠️ SHIPS OFF, and OFF means the gateway NEVER OPENS A WEBSOCKET — she is not
# connected, not merely quiet, and the Durable Object costs nothing. Flipping it
# is an OWNER/CONDUCTOR decision, never a side effect of a deploy, and the flip
# has a documented SECOND step: `POST /admin/gateway/start` with an estate
# admin's bearer, or wait up to two minutes for the cron above.
#
# ⚠️ WHAT IT NOW GOVERNS — WIDENED 2026-08-17 with the continuity layer, and the
# switch still governs ALL of it. Three intent-free doors, not one:
#   1. a genuine @mention in a channel;
#   2. a Discord REPLY to one of her own regular messages with "ping on reply"
#      left ON. ⚠️ With the ping removed she is BLIND to it — Discord delivers no
#      content — and there is no way for her to know it happened. Documented in
#      docs/access/discord-bot.md rather than left to be discovered;
#   3. a DIRECT MESSAGE, where no mention is needed at all. This added
#      DIRECT_MESSAGES (1 << 12) to the requested intents — UNPRIVILEGED, no
#      portal toggle, no verification (the privileged three are GUILD_PRESENCES,
#      GUILD_MEMBERS, MESSAGE_CONTENT). DM typing (1 << 14) is deliberately NOT
#      requested: the owner asked for messages, not a typing indicator.
#
# ⚠️ WHAT IT STILL DOES NOT DO: bare-text triggers. `heygabi …` typed with no
# mention, no reply and not in a DM needs Discord's Message Content privileged
# intent — which discord-bot-design.md §1.5 says is NEVER requested. All three
# doors above are messages somebody DELIBERATELY addressed to her, which is why
# none of them moves that line. Turning on bare text is a separate owner
# decision, not a config change.
#
# ⚠️ It also gates the CLARIFYING-QUESTION COMPONENTS on the HTTP interactions
# endpoint: while this is off, a press on a select menu or button from before
# the flip is answered in words and NO Durable Object is woken.
# Flipped off -> ON 2026-08-17 by the CONDUCTOR at the owner's wake-up order
# (his key was pasted, piped to ANTHROPIC_API_KEY_GABI, and the drop-box
# blanked the same minute). The 2-minute cron is the starter — no manual
# POST /admin/gateway/start needed. Turning her back off is this one line.
GABI_MENTIONS = "on"

# ⚠️ THE TIER-1 KILL SWITCH — GABI's first WRITE capability (src/delegated.ts).
#
# Owner ask 2026-08-17: "Can I dm her an isbn or a photo and she adds it to the
# catalog?" and "Hey Gabi, fix all my missing details… Hey @Sam i went ahead and
# fixed all your missing stuff." Approved as Tier 1 of the T0–T4 ladder ("that
# looks good, start with that", then "all of it"): additive writes with easy
# undo, auto-applied and then reported.
#
# Affirmative-only in the exact idiom of MODERATION_ENABLED and GABI_MENTIONS
# above: "on" and nothing else; "true", "1", "yes" and every typo mean OFF, and
# test/delegated.test.ts pins that both ways.
#
# ⚠️ It ships "on" because the owner's approval was explicit, not because a
# capability like this defaults open. OFF means no write, no site call and no
# credential read — but NOT silence: a DM'd ISBN still gets "adding books from
# Discord is switched off" rather than falling through to a shelf search for a
# thirteen-digit number, which returns nothing and reads as broken.
#
# ⚠️ WHAT SHE CAN DO WITH IT ON, and the boundary is the whole design:
#   - add a book by ISBN         (needs the asker's `editCatalog` THERE)
#   - run the missing-details sweep, attributed to the asker (`runResearch`)
# and NOTHING ELSE. She holds no permissions of her own: she asserts an identity
# the person proved themselves (the /link document), and the DESTINATION CATALOG
# checks that person's real stored role before it acts. A barcode whose book is
# already on that shelf is handed back UNANSWERED — the four-way rescan question
# is a mutation of existing data and belongs to a confirm lane that does not
# exist yet.
GABI_DELEGATED_WRITES = "on"

# The Tier-2 CONFIRM LANE — the "confirm lane that does not exist yet" the comment
# above once referenced; it exists now (confirm.ts + confirm-propose.ts, Discord
# surface). Same affirmative-only idiom: "on" and nothing else is on; the propose
# path is fully inert when this is absent/off. Flipped ON 2026-08-24 with the owner
# present to watch the first live proposals (never-before-exercised live; the
# library-panel surface remains separate/undeployed).
GABI_CONFIRM_T2 = "on"

# The two catalogs a delegated verb may be routed to. Vars, not secrets: they
# are public hostnames that appear in her own replies.
#
# ⚠️ TWO, because there really are two Workers with two D1 databases — one build
# deployed to two targets (library_catalog/docs/access/second-instance.md). A
# person holding a role on BOTH is asked which one they meant; she never guesses,
# because a book added to the wrong household's shelf is a tidy-up somebody has
# to notice first.
LIBRARY_MAIN_URL = "https://library.heygabi.ai"
LIBRARY_FRIEND_URL = "https://padhard.heygabi.ai"

# ⚠️ THE DOCS KILL SWITCH — GABI reads the estate's OWN documentation
# (src/estate-docs.ts; design docs/info/gabi-docs-assistant-design.md phase 4).
#
# Owner ask 2026-08-17, verbatim: "let's make sure GABI can read all of our docs
# and stuff so she can even help me if needed for let's say I don't have a
# Claude code session open." Phases 1/2/5/6 answered that in a BROWSER
# (https://heygabi.ai/docs/); THIS is the half that answers it in Discord, which
# is where he actually is when no session is open.
#
# Affirmative-only in the exact idiom of MODERATION_ENABLED, GABI_MENTIONS and
# GABI_DELEGATED_WRITES above: "on" and nothing else; "true", "1", "yes" and
# every typo mean OFF, and test/estate-docs.test.ts pins that both ways.
#
# ⚠️ IT SHIPS OFF, and that is a DEPARTURE FROM GABI_DELEGATED_WRITES rather
# than an oversight. Tier 1 ships "on" because the owner approved that
# capability in words. This one reaches PII plus an operations runbook —
# break-glass SQL, deploy levers, secret NAMES and where they live, the /admin
# grant grammar, and household members' emails and role assignments. Design §7's
# owner step 4 is explicit: flipping it is "a deliberate act, never a side
# effect of a deploy."
#
# ⚠️ OFF DOES NOT MEAN SILENT. A docs question still gets "reading the estate
# docs from Discord is switched off" rather than falling through to a shelf
# search for a phrase about deploys, which returns nothing and reads as broken.
# The switch removes the capability; it must not remove the sentence.
#
# ⚠️ ON IS NOT A GRANT. With this on, EVERY docs question is still checked
# per-asker against the estate directory by the auth Worker: she asserts the
# email the person proved themselves at /link, and auth.heygabi.ai applies the
# same devopsAllows() the browser door uses. A non-devops household member gets
# a worded refusal and GABI never sees a byte of the corpus on their behalf.
# Revoke someone's devops in /admin and their next question is refused, with no
# deploy and no second place to remember.
#
# ⚠️ THE FLIP HAS A SECOND STEP: the owner (or anyone who linked before
# 2026-08-18) must re-run /link ONCE, because links written before that date
# carry no email and cannot be upgraded from the outside. That is the owner's
# own decision, design §9.1: "1.a i think its just me". An un-upgraded link is
# told so in words — "your link was made before I could check estate roles" —
# never refused as though it were a permissions problem.
# Flipped off -> ON 2026-08-18 by the CONDUCTOR as the final delivery step of
# the owner's "all of it" batch (the GABI_MENTIONS wake-up precedent: postures
# flip by conductor hand at the owner's order, never as a deploy side effect).
# Off is this one line back.
GABI_DOCS = "on"

# The estate's auth Worker, which serves the docs corpus behind its devops gate.
# ⚠️ A var, not a secret: it is a public hostname and the credential is the
# BEARER, not the address. Present so a test or a future lane can point
# elsewhere; the default in code (src/estate-docs-exec.ts) is this same host.
AUTH_BASE_URL = "https://auth.heygabi.ai"

# ⚠️ TIER 0c — GABI READS THE HOUSEHOLD'S OWN BOOKS. Affirmative-only: "on" and
# nothing else. "true", "1", "yes" and every typo mean OFF.
#
# What it opens: the TEXT of the books the nightly ingester has packed into
# ebooks-gated/text/ — 157 packs at the time this shipped, out of 1,079
# catalogued audiobooks, and growing every night with NO deploy. Design §4.6
# ships it dark, and design §9 owner step 2 is explicit that flipping it is a
# deliberate act rather than a side effect of a deploy.
#
# ⚠️ ON IS NOT A GRANT. Every book call carries the asker's PROVEN email and the
# audiobook Worker resolves it against the estate directory's vis_ebooks — the
# same resolveEbookAccessForEmail() the ebook shelf and the byte streams use.
# Revoke someone's vis_ebooks in /admin and their next question is refused, with
# no deploy. A leak of the token below buys reading on behalf of people who
# could already read.
#
# ⚠️ OFF IS NOT SILENT. With this off, a question about what HAPPENS in a book
# gets "reading the actual text of our books is switched off" plus an offer of
# what the catalogue knows — never a catalogue lookup that returns a narrator
# and reads as an answer.
#
# Flipped off -> ON 2026-08-18 by the FINISHER as the delivery step of the
# owner's promised live test, by the same conductor-hand precedent GABI_DOCS
# records two blocks above. Off is this one line back, then redeploy.
GABI_BOOKS = "on"

# The estate's audiobook Worker, which serves the book-text routes behind the
# vis_ebooks gate. ⚠️ A var, not a secret: a public hostname, and the credential
# is the BEARER rather than the address. The default in code
# (src/book-knowledge-exec.ts) is this same host.
AUDIOBOOK_API_URL = "https://audiobook-api.heygabi.ai"

# ⚠️ TIER 2 — GABI REMEMBERS YOU BETWEEN CONVERSATIONS. Affirmative-only: "on"
# and nothing else.
#
# What it turns on: a short (<=2 KB) note per PERSON, distilled from their own
# conversations when one goes quiet, and read back on every turn so the first
# thing she says after a gap is not the first thing she said before it. The
# owner's ask: "so its not a fresh bot to talk to each time."
#
# ⚠️ IT SHIPS OFF, and it stays off until the owner flips it (design §9 owner
# step 1). A feature that writes down what people say about themselves is not
# one to enable as a side effect of a deploy — the GABI_BOOKS precedent.
#
# ⚠️ OFF IS SILENT, and that is correct here where it was not for books: nobody
# asks a question that only memory could answer, so there is no sentence to say.
# The 30-minute verbatim window still works exactly as it does today, nothing is
# written, nothing is read, and no prompt changes.
#
# ⚠️ ON IS NOT A GRANT. A profile is built ONLY from that person's own messages
# (the conversation key has always included the author, so a channel of five
# people is five records), and they can see and clear it at any time with
# `/gabi memory` or by asking her to forget.
#
# Storage: gabi_profiles/{personKey} in Firestore, using the service account
# this Worker ALREADY holds for discord_links. ⚠️ No new secret, no new holder,
# no new trust edge — that was the deciding argument for Firestore over D1
# (docs/info/gabi-memory-design.md §4.1).
# Flipped off -> ON 2026-08-18 by conductor hand at the owner's order
# ("flip gabi memory on"), same precedent as the flips above. Off is this
# one line back, then redeploy.
GABI_MEMORY = "on"

# ⚠️ PERSONALITY — she picks a voice per person and drifts gradually between
# NEIGHBOURING ones. Affirmative-only: "on" and nothing else.
#
# ⚠️ THIS ONE SHIPS ON, and that is a departure from GABI_BOOKS / GABI_MEMORY
# rather than an oversight. Those two open a gated corpus and a durable note
# about a person, and each needed the owner's consent before it could do
# anything. This one changes WORDING: he ordered it explicitly ("we need to give
# Gabi personality settings"), it reveals nothing, it stores nothing beyond a
# trope name, and the failure mode of getting it wrong is "she sounds odd"
# rather than "she leaked something". Off is this one line back.
#
# ⚠️ TONE, NEVER TRUTH. Every refusal, spoiler bound, cap sentence and
# availability grounding is personality-INVARIANT — the voice block is APPENDED
# to the system prompt and every refusal reaches a person as a CONSTANT the
# model is told to relay, so a trope cannot rewrite a string it never sees.
#
# ⚠️ PG-13 is a CEILING, not a register (owner, 2026-08-18): default mild, lean
# in only where somebody is clearly playing along, never past that line.
#
# ⚠️ OFF IS SILENT — nobody asks a question only a personality could answer.
GABI_PERSONALITY = "on"

# ⚠️ THE INTENSITY DIAL — how far she takes whatever voice she is in.
#
# Owner ask 2026-09-01, verbatim: "Gabi can be a bit more into her personality,
# she can be a bit snarkier or a bit more flirty. this is a private server so we
# can be a bit mean to my friends. let her really sell the personality. Think of
# Grok from X in its all go mode. have it really lean into stuff she's ingested
# from the books to build out those personalities."
#
#   standard — ⚠️ BYTE-IDENTICAL to the pre-dial bot. Nothing is appended, and a
#              test holds the whole prompt as a literal so softening her is this
#              one word plus a deploy rather than an archaeology dig.
#   full     — the roast licence, the book-fuelled personalisation instruction
#              and the written floor are appended to the system prompt.
#
# ⚠️ FAIL CLOSED. Anything that is not exactly "full" reads as "standard" —
# "on" and "true" included, because they are what somebody who knows this
# Worker's OTHER postures would type, and guessing them would turn her voice up
# by typo.
#
# ⚠️ IT SHIPS AT "full", which IS the owner's ask. It multiplies whatever trope
# GABI_PERSONALITY picked; the eleven tropes, the drift graph and the pin are
# untouched. The persona block is still appended LAST, so its PG-13 register
# clause and its invariance clause remain the final words in the prompt: the
# dial raises BITE, never explicitness, and it changes no refusal, no spoiler
# bound and no citation.
#
# ⚠️ ONE PROMPT, TWO PROVIDERS. Haiku and the Groq shadow rung render the same
# system string; there is no provider-specific fork and there must not be one.
GABI_EDGE = "full"

# ⚠️ TIER 0d — the asker's OWN shelf: their reading list, their reviews, and the
# books they have not reviewed. Affirmative-only "on".
#
# ⚠️ IT SHIPS OFF. This reaches a named person's personal reading list, so it
# follows the GABI_BOOKS precedent rather than the personality one — flipping it
# is the owner's own act.
#
# ⚠️ ON IS NOT A GRANT. Every query is built from the asker's OWN uid and display
# name, read server-side from discord_links; no tool argument could carry
# somebody else's identity. Another person's REVIEWS are public site content and
# answerable, attributed; another person's TBR is never offered in any surface.
#
# ⚠️ NO NEW SECRET. Both stores are Firestore collections this Worker already
# reaches with the service account it holds for discord_links.
# Flipped off -> ON 2026-08-18 ~15:30 by conductor hand: the owner's order
# was the OUTCOME ("We need GABI to know the tbr, reviews, and unread"),
# and dark was the builder's caution, not an owner gate. Off is one line back.
GABI_SHELF = "on"

# ⚠️ BOOK SUGGESTIONS, FORMAT-AWARE — owner ask 2026-08-18, verbatim: "I also
# need Gabi to give book suggestions and clarify if I want audio physical or
# ebook. For physical I only want her to suggest a physical book to a linked
# person who can view a book from the table she's suggesting."
#
# ⚠️ IT SHIPS ON, on the GABI_PERSONALITY precedent rather than the GABI_BOOKS
# one: the owner ordered the OUTCOME, and this lane opens NO NEW CORPUS. It
# composes from catalog.csv (already public) and the asker's own shelf (already
# behind GABI_SHELF), so flipping it grants nothing that was not already
# granted. The lever exists so there IS a lever. Off is one line back, and OFF
# IS NOT SILENT — she says suggestions are switched off rather than falling
# through to a catalogue search that reads as a broken answer.
#
# ⚠️ ON IS NOT A GRANT, AND THE THREE FORMATS ARE THREE DIFFERENT GATES:
#   audio    - the public slice audiobooks.heygabi.ai already publishes to the
#              open internet. Ungated, for the same reason /have is.
#   ebook    - refused unless the ESTATE says vis_ebooks. Asked of the audiobook
#              Worker through the existing books port; never decided here, and
#              the refusal relayed is the estate's own sentence.
#   physical - refused unless the asker is KNOWN on the library instance the
#              print row came from, asked with the delegated `whoami` verb.
#
# ⚠️ WHICH INSTANCE, MEASURED 2026-08-18 rather than assumed: catalog.csv's
# library_work_id is a bare integer naming no instance, so the question was
# answered at the WRITER. audiobook_catalog/app/library_link.py stamps the
# column from GET <LIBRARY_MAPPING_URL>/api/machine/audiobook-mapping, and
# audiobook_catalog/.env sets LIBRARY_MAPPING_URL=https://library.heygabi.ai —
# the MAIN library's Worker. padhard is the friend instance with its own D1 and
# the pipeline never reads it. So a print row IS the main library's copy, and
# the gate asks about the main library. ⚠️ If that env var ever moves, the
# constant in src/suggest.ts is wrong and the gate must widen to "known on
# EVERY instance" — the default-deny form.
#
# ⚠️ NO NEW SECRET AND NO NEW TRUST EDGE. Every port this lane uses is one the
# Worker already builds.
GABI_SUGGEST = "on"

# ⚠️ THE FUN MENU'S WRITING HALF — /rsvp and /progress (2026-09-02, design §2d
# and §2e). Code: src/club-write.ts; checklist: docs/access/discord-bot.md §15.
#
# Affirmative-only in the exact idiom of MODERATION_ENABLED, GABI_MENTIONS,
# GABI_DELEGATED_WRITES and GABI_CONFIRM_T2 above: "on" and nothing else;
# "true", "1", "yes" and every typo mean OFF.
#
# ⚠️ IT SHIPS OFF, AND THE REASON IS A MISSING MEASUREMENT RATHER THAN CAUTION.
# The collection paths and the member-slug doc id are MEASURED (enforce-routes.ts
# sweeps clubs/{id}/reads/{readId}/progress; poll-vote writes votes/{slug}); the
# FIELD NAMES inside an RSVP and a progress document are NOT — they live in
# audiobook_catalog/site/, which the build that wrote this was directed not to
# read. This Worker's service account BYPASSES firestore.rules, so a wrongly
# shaped write is not refused, it SUCCEEDS — and the club page then shows
# nothing, with no error anywhere, on somebody else's surface.
#
# ⚠️ SO THE FLIP HAS A STEP BEFORE THE DEPLOY: verify CLUB_WRITE_SHAPES in
# src/club-write.ts against the site's own writers, correct anything wrong, and
# only then set "on". Never a side effect of a deploy; never done by an agent.
#
# ⚠️ OFF also HIDES both commands from Discord (commandsFor()), the moderation
# pair's precedent — but the ROUTER still answers them, so a stale global
# command gets the worded "switched off" rather than "This interaction failed".
GABI_CLUB_WRITES = "off"

# ⚠️ THE GROQ FIRST-LINE POSTURE — the ONLY three-state switch on this Worker
# (owner ask 2026-09-01: "we just used groq in a different project, lets
# integrate that into our gabi model as a first line before going to haiku
# tokens"). Design: docs/info/gabi-groq-rung.md; code: src/gabi-groq.ts.
#
#   off    — SHIPS THIS WAY. Byte-identical to the pre-Groq bot: no prompt is
#            built, no request is made, and every call is the Haiku one it
#            always was. Pinned by test/gabi-groq.test.ts.
#   shadow — Groq is called BESIDE Haiku, one `gabi_groq_shadow` line is logged
#            (latency, lengths, did-it-answer, and agreement where that means
#            something) and ⚠️ HAIKU'S ANSWER IS THE ONE USED. Nothing a person
#            sees changes.
#   first  — Groq is tried ONCE; on any failure the existing Haiku call runs
#            unchanged and the person cannot tell it happened.
#
# ⚠️ FAIL CLOSED: `groqMode()` coerces anything that is not exactly "shadow" or
# "first" to "off" — absent, empty, "on", "true", "1", a capital, a typo. An
# unrecognised mode is NEVER guessed into the more permissive neighbour.
#
# ⚠️ SHADOW BEFORE FIRST. This is the estate's shadow-first enforcement rule
# (off → shadow → enforce), and the flip to "first" is the OWNER'S, made after
# reading the shadow lines — never a side effect of a deploy, never an agent's.
#
# ⚠️ SCOPE: TOOLLESS CALLS ONLY — classification, small talk, the memory
# distillation and the T2 fix parse. A tool-loop turn stays on Anthropic in
# EVERY posture; the Anthropic<->OpenAI tool-schema translation is phase 2.
#
# ⚠️ IT DOES NOTHING WITHOUT GROQ_API_KEY_GABI (a secret, below). The switch and
# the key are two independent owner steps and neither alone changes an answer.
GABI_GROQ = "first"

