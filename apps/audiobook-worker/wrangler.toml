# The audiobook catalog's Worker — the FOURTH consumer of the estate's proven
# pattern (audiobook-auth-migration.md §2): its OWN thin Worker, deliberately
# NOT routes bolted onto auth-worker — a bug in a club endpoint must never be
# able to take down grant/revoke for every app (the estate's separation of
# concerns: "the estate answers in/out; the apps answer what/here").
#
# Phase 0 surface: GET /api/health, GET /api/me (server-verified Firebase
# token → estate status + audiobook ladder role from site_roles/{uid}).
# Phase 1 server half: POST /api/gate/shadow — the fire-and-forget would-deny
# receiver (204 always; logs, never stores, never enforces).
#
# ⚠️ NOT DEPLOYED, ON PURPOSE — deploy, route, and secrets are a deliberate
# owner/conductor step, never a side effect of building this (Phase 0's
# "Reverse: delete the worker; nothing referenced it" depends on that).

name = "audiobook-worker"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Added at deploy time, mirroring the sibling Workers' history. The hostname
# is the owner's pick at deploy time (the site itself lives at
# https://audiobooks.heygabi.ai; the Worker needs its own, e.g.:)
# Route uncommented 2026-08-16 at first deploy (owner approved phases 0-2
# and said "send it"). The NOT-DEPLOYED header above is now historical.
routes = [{ pattern = "audiobook-api.heygabi.ai", custom_domain = true }]

# ⚠️ RETENTION — the fix for the 2026-08-16 soak pack's blocker 1, enabled
# 2026-08-17. Without this, a shadow decision existed only as a line on an
# attached `wrangler tail` and was UNRECOVERABLE once emitted: every evidence
# pack was a 5-minute sample and the hours between packs were gone. With it,
# the same lines land in Workers Logs, which is RETROSPECTIVE — the next pack
# queries a window instead of catching what happens to arrive while watching.
#
# PRECONDITION, met before this was turned on: the gate log lines used to
# carry the caller's EMAIL IN CLEARTEXT, which is defensible on an ephemeral
# tail and not defensible in a retained record. Both lines (ab_gate_shadow and
# its enforce twin ab_gate) now carry `email_hash` + `identity_class` instead
# — src/pseudonym.ts, which argues the one-way hash and the salt choice.
# ⚠️ Do not put a raw address back in a log line while this is enabled.
#
# Retention length is PLAN-DEPENDENT (3 days on the free tier, 7 on paid) and
# is NOT verified here — check the dashboard before relying on a 7-day
# lookback. head_sampling_rate is deliberately unset (= 1, keep everything):
# the whole complaint was too few lines, and this Worker's volume is a
# household's.
[observability]
enabled = true

[vars]
# Explicit, affirmative value — the canonical verifier's dev bypass requires
# ENVIRONMENT === 'development', so anything else gets real authentication
# (conformance §8.2 #8).
ENVIRONMENT = "production"
# Pinned as iss AND aud in the verifier — the shared project every consumer uses.
FIREBASE_PROJECT_ID = "audiobook-catalog"
# Break-glass: listed emails resolve to ladder 'owner' and are never demoted.
OWNER_EMAILS = "nbaslamking@gmail.com"
# The estate directory consulted via POST /api/estate/seen (cached, TTL 10 min).
ESTATE_AUTH_URL = "https://auth.heygabi.ai"
# The estate-check mode: "off" | "shadow" | "enforce" (anything else reads as
# "off" — affirmative values only, same philosophy as the dev bypass). Phase 0
# ships OFF; the flip to "shadow" is Phase 1's deliberate act, and "enforce"
# is gated on the measured soak criterion (migration design §4) — never a
# side effect of a deploy.
# Flipped off -> shadow 2026-08-16 the moment the client reporter shipped
# (owner approved phases 0-2; phase 1 is exactly this). Shadow LOGS
# would-deny decisions and acts on nothing; the flip to "enforce" is a
# separate owner-gated decision on soak evidence, never a side effect.
ESTATE_CHECK = "shadow"
# Exact browser origins allowed on /api/* (abCors in src/index.ts) — the
# audiobook site's prod + dev lanes share ONE origin (the dev lane is a /dev/
# PATH on the same host, measured from audiobook_catalog docs/access
# GIT_CI_DEPLOY.md 2026-08-16). Comma-separated, exact scheme+host, no
# trailing slash. A local dev origin joins in .dev.vars, never here.
# ⚠️ ebooks.heygabi.ai joined 2026-08-17 with the gated manifest: the ebook
# shelf is served through the ebooks-door Worker on its OWN hostname, so
# without it here the shim's fetch dies as an opaque CORS network error —
# which looks exactly like the Worker being down, not like a missing origin.
SITE_ORIGINS = "https://audiobooks.heygabi.ai,https://ebooks.heygabi.ai"

# Not in this file, ever — the secrets. At deploy time (owner/conductor):
#   wrangler secret put FIREBASE_SERVICE_ACCOUNT   (pipe the JSON file in —
#     never paste it into a terminal line, never echo it; same value and
#     custody as auth-worker's. This Worker holds the DATASTORE scope only —
#     see src/roles.ts.)
#   wrangler secret put ESTATE_APP_TOKEN_AUDIOBOOK (mint fresh; the SAME
#     value goes on the auth Worker under the same name — declared there in
#     env.ts as of Phase 0.)
# Locally they live in .dev.vars (gitignored).
#
# OPTIONAL, deliberately UNSET: GATE_HASH_SALT. The identity hash in the log
# lines uses a hardcoded non-secret domain-separation salt on purpose
# (src/pseudonym.ts argues why: the threat is accidental disclosure through a
# retained log, not an adversary who already holds the source). Set it as a
# secret only if the owner wants a GUESSED address to be uncheckable too —
# and note that changing it re-pseudonymises everyone, so never mid-soak.

# The ebook manifest's PRIVATE store (owner directive 2026-08-17). Created
# 2026-08-17 with public access DISABLED and no custom domain — verified with
# `wrangler r2 bucket dev-url get ebooks-gated` ("Public access via the r2.dev
# URL is disabled"), which is the whole point of it not being `audiobook-covers`.
#
# ⚠️ Never enable a public URL or attach a domain to this bucket. The manifest
# names every ebook file in the house, including the `needs_human_cover` list,
# and the Worker's binding is meant to be the only way to read it.
#
# Written by the audiobook pipeline (scripts/publish_ebooks_manifest.py, sync
# step 5.8); read by GET /api/ebooks/manifest.
[[r2_buckets]]
binding = "EBOOKS_GATED"
bucket_name = "ebooks-gated"
