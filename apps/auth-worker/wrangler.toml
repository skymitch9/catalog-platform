# The estate auth Worker — its own config, its own D1, deliberately apart
# from every catalog's deploy AND from the index Worker (the directory that
# must never be bulk-deleted does not live next to a table whose write
# protocol IS bulk deletion — estate-auth-design.md §4.1).
#
# DEPLOYED 2026-08-14 — live with its custom domain, remote migrations applied.
# (This header once gated the first deploy; the gate served and is retired.)

name = "estate-auth"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Added at deploy time by the dispatcher, 2026-08-13, per the header's gate.
routes = [{ pattern = "auth.heygabi.ai", custom_domain = true }]

# ⚠️ CRON TRIGGERS — added 2026-09-05, this Worker's first. Owner ask 16:50
# Phoenix ("then do the scripts you think are the best for routes"); candidates
# #3 and #4 of docs/info/scripts-inventory-2026-09-05.md §7 both land here
# because both need a binding this Worker already has and no other platform
# Worker does.
#
# ⚠️ THESE STRINGS ARE DISPATCHED ON, CHARACTER FOR CHARACTER, in src/index.ts's
# scheduled(), and test/crons.test.ts PARSES THIS FILE and asserts both. That
# guard exists because the failure is silent: a string that drifts from its
# dispatch runs NOTHING, for ever, while the trigger still shows as installed in
# the dashboard. Change a string here and the test fails until index.ts agrees.
#
#   "41 10 * * *"  R2 backup retention (src/r2-prune.ts). DAILY because every
#                  writer is daily — backup.yml's own cron is "12 9 * * *" and
#                  scripts/backup-docs.mjs runs 03:00 local — and at :41 past
#                  10 because that is ~89 minutes after CI starts writing, well
#                  clear of CI's own `retention` job (whole workflow measured at
#                  144 s) even when GitHub delays a scheduled run. ⚠️ SHIPPED IN
#                  SHADOW: see R2_PRUNE_MODE below. It is a BACKSTOP, not the
#                  primary — CI still prunes on every run; this catches the
#                  failure backup.yml's header names, GitHub disabling a
#                  scheduled workflow after 60 days of repo inactivity.
#
#   "19 * * * *"   The estate probe suite (src/estate-probes.ts, running
#                  tools/estate-probes' 145 assertions). HOURLY because the
#                  incident it exists for is drift in somebody else's console —
#                  a Firebase authorised-domain edit, with no notification
#                  anywhere — and hourly bounds "how long can the estate be
#                  broken before anybody knows" at 60 minutes. Daily would bound
#                  it at 24 hours, which for a broken front door is an obituary,
#                  not a monitor. Sub-hourly buys nothing measurable and ~3,500
#                  requests/day already flow from this.
#
# ⚠️ Minutes are staggered on purpose and NEITHER IS :00. The estate's other
# crons sit at "7 * * * *" (both catalog details sweeps), "*/30" and "*/2"
# (the GABI gateway); :00 is where every scheduler queues its burst. The games
# Worker's staggering is the precedent (inventory §5.1).
#
# ⚠️ The account moved to Workers Paid on 2026-08-17, raising the cron limit
# from 5 to 250 (apps/discord-worker/wrangler.toml:26 records the refusal under
# Free that measured it). In use across the estate before these two: 5.
[triggers]
crons = ["41 10 * * *", "19 * * * *"]

# ⚠️ `namespace_id` is arbitrary but changing it silently resets every counter.
# "2001" — deliberately NOT the games catalog's "1001"; separate counters for a
# separate Worker. Tighter than the catalogs (60/min vs 300/min) because this
# surface is an auth directory: /seen arrives at most once per user per app per
# TTL window, and the admin API is one household. The middleware fails open
# with a log line if this binding is absent, so dev and tests run unthrottled.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "2001"
simple = { limit = 60, period = 60 }

[vars]
# Explicit, affirmative value — the canonical verifier's dev bypass requires
# ENVIRONMENT === 'development', so anything else gets real authentication
# (conformance §8.2 #8).
ENVIRONMENT = "production"
# Pinned as iss AND aud in the verifier. The shared project every consumer uses.
FIREBASE_PROJECT_ID = "audiobook-catalog"
# Break-glass (§4.3): approved + approver regardless of table state. The ONLY
# bootstrap — this Worker deliberately has no first-sign-in-claims rule.
# ⚠️ TWO owner accounts as of 2026-08-16 (owner order, folded into the role-
# ladder build): mitchlandtv@gmail.com is the owner's second Google account —
# the one that owns the audiobook-catalog GCP project — and must carry every
# permission the primary does ("give it all permissions my main has so we
# dont need to worry in the future"). Getting this var right matters more
# than anything else in this file: an owner locked out of the estate's own
# break-glass is the worst failure mode. Comma-separated, parseOwnerEmails()
# (env.ts) trims + lowercases each entry independently.
OWNER_EMAILS = "nbaslamking@gmail.com,mitchlandtv@gmail.com"
# The admin UI's origin — the apex, and nothing else (owner decision #6).
ADMIN_ORIGINS = "https://heygabi.ai"
# Browsers allowed to call GET /api/estate/me — the apex AND the audiobook
# site (its /dev/ lane shares the same origin). ⚠️ Wider than ADMIN_ORIGINS
# on purpose, and consulted ONLY by the /me CORS; the admin API stays
# locked to ADMIN_ORIGINS alone.
ME_ORIGINS = "https://heygabi.ai,https://audiobooks.heygabi.ai"
# ⚠️ BACKUP RETENTION POSTURE — off | shadow | enforce (src/r2-prune.ts).
# This Worker's ONE destructive capability: the "41 10 * * *" cron above can
# delete objects from the private `estate-backups` bucket.
#
# ⚠️ THIS VALUE IS "shadow" AND THE COMMITTED FILE MUST KEEP SAYING "shadow"
# until the gate below is met.
#   off      the handler returns before the first list() — no subrequest, no cost
#   shadow   lists, PLANS, logs every would-delete key, and deletes NOTHING
#   enforce  the plan is executed
#
# ⚠️ Anything unrecognised — including absent — parses to `off`, never
# `enforce` (parseR2PruneMode). A typo must not start deleting backups.
#
# Read the shadow log with:
#   npx wrangler tail estate-auth --format json | jq 'select(.logs[]?.message[]? | test("r2-prune"))'
#
# 🔴 THE GATE, and it is unusually strong for a posture flip because an
# INDEPENDENT ORACLE exists. `node scripts/prune-r2-backups.mjs estate-backups
# <the same prefixes> --keep 8 --dry-run` prints the same plan, from the same
# shared planRetention(), over the same bucket. So:
#
#   flip to enforce only after FIVE shadow runs whose would-delete set matches
#   the script's dry run KEY FOR KEY, at least one of them non-empty
#
# The "at least one non-empty" half is the falsifiable one, and it is the half
# that is easy to skip: five agreements on "delete nothing" is indistinguishable
# from an instrument that never ran — the exact `0 of 0 — unmeasured, not clean`
# verdict the audiobook auth soak reached, quoted in the index Worker's own
# BILLING_POLICY block for the same reason. Full runbook:
# docs/access/backup-restore.md §3.1; tracked in docs/TODO.md.
#
# ⚠️ Flip it on its own, never as a side effect of an unrelated deploy.
R2_PRUNE_MODE = "shadow"

# Unlisted estate documents (0003 devops, 2026-08-15): the HTML fragments
# GET /api/estate/docs/:slug serves. ⚠️ Content lives HERE and not in the
# repo because the repo is public — see src/docs.ts's header. Write path:
#   npx wrangler kv key put --binding estate_docs "doc:<slug>" --path <fragment.html> --remote
[[kv_namespaces]]
binding = "estate_docs"
id = "3278d5e3b22c4275b83bcc0b1ed5ab9c"

# The PRIVATE estate-backups R2 bucket (.github/workflows/backup.yml is the
# only writer; retention keep-8 per <kind>/<store> prefix). Bound here
# READ-ONLY IN INTENT (owner ask 2026-08-16, "the status page has a row for
# whether backups are actually still running"): src/backups.ts calls only
# `.list()`, never `.get()`/`.put()`, and GET /api/estate/backups
# (requireDevops()) answers aggregate counts/timestamps per known prefix
# only — never a body, a signed URL, or a raw key. The bucket has no public
# access and no custom domain regardless of this binding.
[[r2_buckets]]
binding = "ESTATE_BACKUPS"
bucket_name = "estate-backups"

# The PRIVATE estate-docs-gated R2 bucket — the estate's whole docs/ corpus as
# one gzipped snapshot plus its receipt (GABI docs assistant phase 2; design
# docs/info/gabi-docs-assistant-design.md). Created 2026-08-18; public access
# verified DISABLED the same day (`wrangler r2 bucket dev-url get
# estate-docs-gated` -> "Public access via the r2.dev URL is disabled").
# ⚠️ NEVER enable a dev URL or attach a custom domain: the corpus carries
# break-glass SQL, deploy levers, secret NAMES and household members' emails.
# Bound READ-ONLY IN INTENT — src/estate-docs.ts calls only .get()/.head();
# the sole writer is audiobook_catalog/scripts/publish_docs_snapshot.py on the
# owner's machine, which is the only place all three docs trees exist.
# ⚠️ Distinct from the `estate_docs` KV namespace above despite the name —
# that serves curated runbook PAGES by slug, this serves the searchable CORPUS.
[[r2_buckets]]
binding = "ESTATE_DOCS"
bucket_name = "estate-docs-gated"

# The PRIVATE estate-catalog-keys R2 bucket — the sealed Claude keys attached to
# a catalog request (design docs/info/request-a-catalog-design.md §6). Created
# 2026-09-05; public access verified DISABLED the same day (`wrangler r2 bucket
# dev-url get estate-catalog-keys` -> "Public access via the r2.dev URL is
# disabled"). ⚠️ NEVER enable a dev URL or attach a custom domain.
# It holds ONLY sealed envelopes, one JSON object per request id:
#   reader/<id>.json  written at submit   owner/<id>.json  written at accept
# Nothing decrypts here: this Worker only PUTs and DELETEs. The one reader is
# the owner-run provisioner on his own machine, which holds the private key
# (catalog-platform/docs/access/keys/, gitignored) and deletes the object after
# `wrangler secret put`. Decline and withdraw delete both objects too.
# ⚠️ DELIBERATELY NOT IN THE BACKUP SET (`backup.yml`, RECOVERY.md §1b): an
# envelope is transient and re-mintable — if it is lost, the requester is asked
# for their key again. Backing it up would multiply copies of somebody else's
# credential for no recovery value.
[[r2_buckets]]
binding = "CATALOG_KEYS"
bucket_name = "estate-catalog-keys"

# ⚠️ THIS WORKER, BOUND TO ITSELF — added 2026-09-06, and the reason is a
# measurement, not a preference: A CLOUDFLARE WORKER CANNOT FETCH ITS OWN ZONE.
#
# The estate-probes cron's FIRST run (01:19 UTC) reported 107/142 passed, 35
# failed, and every failure was an `auth.heygabi.ai` URL answering HTTP 522
# (connection timed out). The other seven areas were green, and the identical
# suite from a laptop had been 145/145 minutes earlier. The red said nothing
# about production — it said the request never left the isolate.
#
# `SELF.fetch()` invokes this Worker's own fetch handler directly, no edge hop,
# so there is no loop to time out. ONE caller: src/estate-probes.ts's
# sameZoneFetch(), for same-origin probe URLs only.
#
# ⚠️ IT GRANTS NOTHING. A self-binding reaches only the routes this Worker
# already serves, and every gate runs exactly as it does for a browser — the
# probe suite holds no credential and every same-zone row it asserts is a 401 or
# a health envelope.
[[services]]
binding = "SELF"
service = "estate-auth"

[[d1_databases]]
binding = "DB"
database_name = "estate_auth"
# Created 2026-08-13 in region WNAM (`wrangler d1 create estate_auth`).
# ⚠️ Remote migration deliberately NOT applied — dispatcher's, with the deploy.
database_id = "d94ffe45-4dd0-4dc2-86de-b8c4d649c1cb"
migrations_dir = "migrations"

# Not in this file, ever: the per-consumer secrets, plus the Firebase
# service-account JSON behind /api/estate/site-roles, plus the pipeline
# trigger token behind /api/estate/ops/pipeline. At deploy time:
#   wrangler secret put ESTATE_APP_TOKEN_LIBRARY   (and _GAMES, _INDEX,
#     _AUDIOBOOK; _LIBRARY2 joins when the second library instance's Worker
#     env is provisioned — unset until then, deliberately)
#   wrangler secret put ESTATE_APP_TOKEN_DISCORD_DOCS  (GABI docs assistant
#     phase 3, added 2026-08-18. ⚠️ NOT A PORTAL VALUE — the conductor MINTS it
#     (`openssl rand -hex 32`) and pipes the SAME value to exactly TWO holders:
#     here, and apps/discord-worker. Two, not three: this is DOOR B onto the
#     estate docs corpus and nothing else.
#     ⚠️ **IT IS NOT `ESTATE_APP_TOKEN_DISCORD`.** That token exists already and
#     is shared by the discord-worker and BOTH library Workers for the Tier-1
#     delegated writes. Reusing it here would mean a leak from either library
#     instance also opened break-glass SQL, deploy levers, secret names and
#     household members' emails. A fresh trust edge gets a fresh pair — and
#     re-minting the T1 token to add a holder would break T1, so a new name was
#     the only correct move. Custody: docs/access/estate-docs.md §8.
#     ⚠️ HOLDING IT AUTHORISES NO READ ON ITS OWN. It proves only "this request
#     came from the estate's Discord Worker"; the request must ALSO carry the
#     asker's proven email in `X-Estate-On-Behalf-Of`, and this Worker resolves
#     THAT email against the directory and applies devopsAllows() — the same one
#     implementation the browser door uses. Revoking someone's devops in /admin
#     shuts this door on their next question, with no deploy.
#     ⚠️ Deliberately NOT a CONSUMER_APPS entry — adding it there would silently
#     make it a valid POST /api/estate/seen bearer, which is a wider capability
#     than the one being granted. It is read by ONE module: src/estate-docs.ts.
#     ⚠️ SHIPS DARK until set: no bearer comparison happens at all, every request
#     falls through to door A, and the corpus behaves exactly as it did before
#     phase 3.)
#   wrangler secret put FIREBASE_SERVICE_ACCOUNT   (pipe the JSON file in —
#     never paste it into a terminal line, never echo it; see firebase-sa.ts)
#   wrangler secret put ESTATE_CONDUCTOR_TOKEN     (the /status/agents push
#     door, added 2026-08-18. ⚠️ NOT A PORTAL VALUE — the conductor MINTS it
#     (`openssl rand -hex 32`). ONE holder on the server side: this Worker; the
#     other copy is a gitignored custody file under docs/access/keys/ that
#     scripts/push-agent-board.mjs reads. Custody + rotation:
#     docs/access/agent-board.md.
#     ⚠️ USE THE FILE-REDIRECT TRANSPORT ON WINDOWS, never a PowerShell pipe —
#     a piped secret picks up an invisible UTF-8 BOM and the bearer then fails
#     while LOOKING correct (discord-bot.md §7, the incident that cost a night).
#     ⚠️ HOLDING IT AUTHORISES ONE THING: overwriting one advisory JSON blob.
#     No Firestore, no token minting, no role, no pipeline trigger.
#     ⚠️ SHIPS DARK until set — POST answers a worded 503 and never falls back
#     to accepting an unauthenticated write.)
#   wrangler secret put PIPELINE_TRIGGER_TOKEN     (pipe the SAME value as
#     audiobook_catalog's own PIPELINE_TRIGGER_TOKEN — .env there, never
#     printed; see ops.ts for why it must match exactly)
# Locally they live in .dev.vars (gitignored; see .dev.vars.example) or are
# passed as --var flags by the probe suite.
#
# Production should also gain a [[unsafe.bindings]] rate-limiter (RATE_LIMITER)
# at deploy time; the middleware fails open (with a log line) without it, so
# dev and tests run unthrottled by design.
