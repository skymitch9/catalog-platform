# The shared index Worker — its own config, its own D1, deliberately apart
# from every catalog's deploy (the separate-blast-radius rule: a bad index
# deploy must not be able to take a catalog down, and vice versa).
#
# DEPLOYED 2026-08-14 — live with its custom domain, remote migrations applied.
# (This header once gated the first deploy; the gate served and is retired.)

name = "catalog-index"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Added at deploy time by the dispatcher, 2026-08-13, per the header's gate —
# reads went members-only first (§14.3), so going live no longer leaks titles.
routes = [{ pattern = "index.heygabi.ai", custom_domain = true }]

[vars]
# Explicit, affirmative value — the canonical verifier's dev bypass requires
# ENVIRONMENT === 'development', so anything else gets real authentication
# (conformance §8.2 #8).
ENVIRONMENT = "production"
# Pinned as iss AND aud in the verifier. The shared project every consumer uses.
FIREBASE_PROJECT_ID = "audiobook-catalog"
# Which ORIGINS may read /api/* from a browser (readCors in src/index.ts).
#
# ⚠️ Set explicitly 2026-08-16. It was absent, so the code default applied —
# the apex ALONE — and the two catalogs were CORS-blocked from the shared
# index. Measured before changing anything: an OPTIONS preflight from
# https://library.heygabi.ai and from https://boardgames.heygabi.ai each got
# 204 with NO Access-Control-Allow-Origin, while the apex got the header. That
# made the estate-wide search box adopted in both apps (search-normalization
# §0.5) unable to fetch at all — the browser refuses before the request is
# sent, so there is no workaround on the app side.
#
# ⚠️ ADDITIVE ONLY, and first-party only: these are the estate's own catalog
# hosts, the same ones the index already serves data ABOUT. It widens which
# PAGES may ask; it does not widen WHAT is returned — visibility is still
# decided per-caller inside the Worker (an anonymous caller still sees the
# audiobook source only). Never add a third-party origin here.
#
# ⚠️ Comma-separated, exact scheme+host, no trailing slash, no wildcards —
# readCors does an exact `allowed.includes(origin)` after trimming.
READ_ORIGINS = "https://heygabi.ai,https://library.heygabi.ai,https://boardgames.heygabi.ai,https://audiobooks.heygabi.ai"
# Break-glass (design §6 row 4): listed emails are served on local standing
# alone, even with the estate directory unreachable or misconfigured.
OWNER_EMAILS = "nbaslamking@gmail.com"
# The estate directory consulted (cached, TTL 10 min) for membership.
ESTATE_AUTH_URL = "https://auth.heygabi.ai"

[[d1_databases]]
binding = "DB"
database_name = "index_catalog"
# Created 2026-08-13 in region WNAM (`wrangler d1 create index_catalog`).
database_id = "3004d175-3c51-4ed4-ac3e-62859319f8ac"
migrations_dir = "migrations"

# Not in this file, ever — the secrets. At deploy time (dispatcher's):
#   wrangler secret put INDEX_PUSH_TOKEN_GAME       (and _LIBRARY, _AUDIOBOOK)
#   wrangler secret put ESTATE_APP_TOKEN_INDEX      (matching value already
#                                                    SET on the auth Worker)
# Locally they live in .dev.vars (gitignored; see .dev.vars.example) or are
# passed as --var flags by the probe suite (`npm run probe`).
