<title>Shelf Server Runbook</title>
<!--
  ESTATE RUNBOOK SHIM — /todo's lock (0003 devops role).

  Born 2026-08-15 as an unlisted /r/<slug>/ page; moved same day to this
  PROPER, TRACKED URL at the owner's order ("give this a proper url since
  we'll be updating it a lot… add it to the status page"). The AUTH is the
  lock, not the URL: this file is a CONTENT-FREE gate — view its source
  signed out and there is no document here, no configs, no topic beyond the
  title. The content lives in the auth Worker's estate_docs KV namespace,
  served by GET /api/estate/docs/shelf-server behind requireDevops()
  (devops OR approver OR owner). A 200 IS the capability probe; 401/403
  leave a quiet refusal. Committing this shim is safe and deliberate for
  exactly that reason — unlike the /r/ mechanism (which stays gitignored
  for any FUTURE page whose URL itself must stay out of the public repo).

  CSP: _headers' /runbooks/* rule — the /todo sign-in shape. Content
  updates never touch this file: edit the source doc (audiobook_catalog's
  LOCAL-ONLY docs/access/SHELF_SERVER.md), regenerate the fragment, and
  `wrangler kv key put` it (exact command recorded in that doc). doc.js
  changes only when the GATE changes.

  ⚠️ BACK-TO-FRONT-DOOR LINK LIVES IN PAGE CHROME, NOT THE GATE (owner ask
  2026-08-16: "put a more easy to access back to front door button" on this
  page). This page has TWO states — the gate (#gate-main) and the injected
  KV document (#doc-mount, doc.js sets gateMain.hidden = true once it loads)
  — and the fragment served from estate_docs KV carries no way back of its
  own. Putting the back link INSIDE #gate-main (the old shape: an `<a
  class="back" href="/status">` as the gate's first child) meant it
  vanished the instant the document rendered, exactly when a long runbook
  most needs an easy way out. The fix is a `<header class="page-chrome">`
  OUTSIDE both #gate-main and #doc-mount, so it survives whichever one is
  showing — never a change to the KV fragment itself, which stays exactly
  what /api/estate/docs/shelf-server returns. Also now points at `/`
  (heygabi.ai) rather than `/status`, matching the front-door pattern this
  whole page family now shares (see /todo's gate for the source of the
  `.back` arrow-SVG idiom this reuses verbatim).

  ⚠️ FACTS AUTO-POPULATE HAPPENS HERE, CLIENT-SIDE, NOT SERVER-SIDE (0007,
  owner ask 2026-08-16: "auto pop the run book"). Two ways were on the
  table: the Worker templating facts into the fragment at serve time
  (docs.ts), or this shim fetching GET /api/estate/facts/shelf and filling
  the already-rendered table itself. Chosen: THIS ONE — client-side —
  because it keeps docs.ts (serves static content) and facts.ts (serves a
  small JSON record) each single-purpose and mutually unaware, and keeps
  per-deployment state (who entered what, when) entirely OUT of the KV
  fragment doc:shelf-server, which stays exactly what a person wrote,
  forever, with no placeholder syntax baked in for a second endpoint to
  understand. The fragment carries plain `data-fact="hardware"` etc.
  attributes on its §0 table cells (see facts.ts for the exact five field
  names) — doc.js's fillFacts() below finds them by attribute and sets
  `textContent`, never `innerHTML`, which is the escaping boundary for
  whatever Justin typed. A facts-fetch failure never blocks the document
  itself from rendering; the cells simply keep the fragment's own default
  placeholder text.
-->

<style>
  :root {
    --bg: #faf8f4; --ink: #26221c; --muted: #6d675d;
    --accent: #7a5c2e; --hairline: #e3ddd1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a16; --ink: #e9e4da; --muted: #a49c8e;
      --accent: #d3b071; --hairline: #3a362e;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); min-height: 100dvh;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  /* Persistent chrome — outside #gate-main and #doc-mount, so it is visible
     in BOTH page states. Real 44px tap target, visible without scrolling. */
  .page-chrome { max-width: 40rem; margin: 0 auto; padding: 1.1rem 1.25rem 0; }
  .back {
    display: inline-flex; align-items: center; gap: .45rem; min-height: 44px;
    color: var(--muted); font-size: .8125rem; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase; text-decoration: none;
  }
  .back:hover { color: var(--ink); }
  .back:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
  .back svg { flex: none; transition: transform .2s ease; }
  .back:hover svg { transform: translateX(-3px); }
  #gate-main { max-width: 40rem; margin: 0 auto; padding: 1.75rem 1.25rem 3rem; }
  #gate { display: flex; flex-direction: column; align-items: flex-start; gap: .9rem; margin-top: 1.2rem; }
  #gate-status { margin: 0; padding: .9em 1.1em; border: 1px dashed var(--hairline); border-radius: 12px; color: var(--muted); font-size: .9375rem; max-width: 32rem; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; min-height: 44px;
    padding: .5em 1.3em; border: 0; border-radius: 999px; background: var(--accent);
    color: var(--bg); font: 700 .9375rem/1.2 inherit; cursor: pointer;
  }
  .btn:disabled { opacity: .5; cursor: default; }
  .linkbtn { border: 0; padding: 0; background: none; color: var(--accent); font: inherit; font-weight: 700; cursor: pointer; }
  .linkbtn:hover { text-decoration: underline; }
  .who { color: var(--muted); font-size: .875rem; }
</style>
</head>
<body>
<header class="page-chrome">
  <a class="back" href="/">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H6"/><path d="m12 19-7-7 7-7"/></svg>
    heygabi.ai
  </a>
</header>
<main id="gate-main">
  <div id="gate">
    <p id="gate-status">Checking sign-in&hellip;</p>
    <button id="signin" class="btn" type="button" hidden>Sign in with Google</button>
    <span id="who" class="who" hidden></span>
  </div>
</main>
<div id="doc-mount"></div>
<script type="module" src="./doc.js"></script>
</body>
</html>
